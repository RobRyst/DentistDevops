apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../apps/dentistdev/base

patches:
  - target:
      kind: Ingress
      name: dentistdev
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dentistdev-dev.local

images:
  - name: ghcr.io/robryst/dentistdev-backend
    newTag: sha-efe53e6272c192b98c65afeb05dce5dae654f29a
  - name: ghcr.io/robryst/dentistdev-frontend
    newTag: sha-efe53e6272c192b98c65afeb05dce5dae654f29a
