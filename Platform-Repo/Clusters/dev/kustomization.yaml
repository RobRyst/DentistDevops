apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dentistdev

resources:
  - mysql-secret.yaml
  - mysql-pvc.yaml
  - mysql-service.yaml
  - mysql-statefulset.yaml
  - dentistdev-secrets.yaml

patches:
  - target:
      kind: Ingress
      name: dentistdev
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dentistdev-dev.local

images:
  - name: ghcr.io/robryst/dentistdev-backend
    newTag: sha-PLACEHOLDER
  - name: ghcr.io/robryst/dentistdev-frontend
    newTag: sha-PLACEHOLDER
