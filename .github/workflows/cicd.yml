name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          IMAGE="ghcr.io/robryst/dentistdev-backend"
          docker build -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:main" -f backend/Dockerfile .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:main"

      - name: Build and push frontend image
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          IMAGE="ghcr.io/robryst/dentistdev-frontend"
          docker build -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:main" -f frontend/Dockerfile frontend
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:main"

      - name: Update dev overlay image tags (commit to git)
        run: |
          set -e
          TAG="sha-${GITHUB_SHA}"
          FILE="Platform-Repo/apps/dentistdev/overlays/dev/kustomization.yaml"

          perl -0777 -i -pe "s|(name:\\s*ghcr\\.io/robryst/dentistdev-backend\\s*\\n\\s*newTag:\\s*).*$|\\$1$TAG|m" "$FILE"
          perl -0777 -i -pe "s|(name:\\s*ghcr\\.io/robryst/dentistdev-frontend\\s*\\n\\s*newTag:\\s*).*$|\\$1$TAG|m" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore(dev): bump images to ${TAG}" || echo "No changes to commit"
          git push
