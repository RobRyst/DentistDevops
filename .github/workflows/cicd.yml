name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          TAG="sha-${GITHUB_SHA}"
          IMAGE="ghcr.io/robryst/dentistdev-backend:${TAG}"
          docker build -t $IMAGE -f frontend/Dockerfile frontend
          docker push $IMAGE
          echo "BACKEND_TAG=$TAG" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          TAG="sha-${GITHUB_SHA}"
          IMAGE="ghcr.io/robryst/dentistdev-frontend:${TAG}"
          docker build -t $IMAGE -f frontend/Dockerfile .
          docker push $IMAGE
          echo "FRONTEND_TAG=$TAG" >> $GITHUB_ENV

      - name: Update Kubernetes manifests with image tags
        run: |
          sed -i "s|sha-PLACEHOLDER|${{ env.BACKEND_TAG }}|g" Platform-Repo/Clusters/dev/kustomization.yaml
          sed -i "s|sha-PLACEHOLDER|${{ env.FRONTEND_TAG }}|g" Platform-Repo/Clusters/dev/kustomization.yaml

      - name: Sync with ArgoCD to deploy the changes
        run: |
          # Ensure ArgoCD CLI is installed and authenticated
          argocd app sync dentistdev-dev --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
