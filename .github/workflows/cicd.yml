name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        run: |
          IMAGE_TAG="ghcr.io/robryst/dentistdev-backend:${GITHUB_SHA}"
          docker build -t $IMAGE_TAG -f backend/Dockerfile .
          docker push $IMAGE_TAG
          echo "BACKEND_IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push frontend image
        id: frontend
        run: |
          IMAGE_TAG="ghcr.io/robryst/dentistdev-frontend:${GITHUB_SHA}"
          docker build -t $IMAGE_TAG -f frontend/Dockerfile .
          docker push $IMAGE_TAG
          echo "FRONTEND_IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Kubernetes manifests with image tags
        run: |
          # Replace the sha-PLACEHOLDER in backend.yaml with the actual backend tag
          sed -i "s|sha-PLACEHOLDER|${{ env.BACKEND_IMAGE_TAG }}|g" k8s/backend.yaml
          # Replace the sha-PLACEHOLDER in frontend.yaml with the actual frontend tag
          sed -i "s|sha-PLACEHOLDER|${{ env.FRONTEND_IMAGE_TAG }}|g" k8s/frontend.yaml

      - name: Sync with ArgoCD to deploy the changes
        run: |
          # Ensure ArgoCD CLI is installed and authenticated
          argocd app sync dentistdev-dev --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
